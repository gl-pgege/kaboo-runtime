name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test
      - run: yarn docs:api
      - run: git diff --exit-code docs/api docs/api-inventory.md
      - run: yarn docs:verify
      - run: yarn docs:llms
      - run: git diff --exit-code llms.txt llms-full.txt
      - run: yarn examples:typecheck
      - run: yarn pack --dry-run

  newest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Install the newest versions the peer ranges allow
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          yarn up "@copilotkit/runtime@$(node -p "require('./package.json').peerDependencies['@copilotkit/runtime']")" "@ag-ui/client@$(node -p "require('./package.json').peerDependencies['@ag-ui/client']")"
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test
